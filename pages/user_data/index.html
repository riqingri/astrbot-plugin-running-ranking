<title>用户数据管理</title>
<link rel="stylesheet" href="./style.css">

<div class="app">
  <header class="topbar">
    <h1>用户数据管理</h1>
    <div class="overview" id="overview"></div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <section class="toolbar">
    <select id="groupFilter" class="input">
      <option value="">全部群</option>
    </select>
    <input id="keyword" class="input grow" type="text" placeholder="搜索用户 QQ / 昵称…">
    <button id="searchBtn" class="btn">搜索</button>
    <button id="resetBtn" class="btn ghost">重置</button>
    <span class="spacer"></span>
    <button id="exportBtn" class="btn ghost">📥 导出新手任务</button>
    <button id="importBtn" class="btn ghost">📤 一键导入</button>
    <button id="createBtn" class="btn primary">＋ 新增</button>
  </section>

  <section class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>暂无数据</div>
  </section>

  <footer class="pager">
    <span id="pageInfo"></span>
    <button id="prevBtn" class="btn ghost">上一页</button>
    <button id="nextBtn" class="btn ghost">下一页</button>
  </footer>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">编辑</h2>
      <button class="close" id="modalClose">×</button>
    </div>
    <form class="modal-body" id="modalForm"></form>
    <div class="modal-foot">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="exportModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>导出新手任务</h2>
      <button class="close" id="exportClose">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>群号（可选，留空为全部群）</label>
        <select id="exportGroup" class="input">
          <option value="">全部群</option>
        </select>
      </div>
      <div class="field">
        <label>开始时间（新增积分 / 训练次数起算，留空不限）</label>
        <input id="exportFrom" type="datetime-local">
      </div>
      <div class="field">
        <label>结束时间（留空不限）</label>
        <input id="exportTo" type="datetime-local">
      </div>
      <div class="export-actions">
        <button class="btn primary" id="exportRun">生成报表</button>
        <button class="btn" id="exportDownload" disabled>下载 CSV</button>
      </div>
      <div class="export-result">
        <div class="export-info" id="exportInfo"></div>
        <div class="table-wrap export-table">
          <table>
            <thead id="exportThead"></thead>
            <tbody id="exportBody"></tbody>
          </table>
          <div class="empty" id="exportEmpty" hidden>暂无数据，先选择时间生成报表</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="importModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>一键导入</h2>
      <button class="close" id="importClose">×</button>
    </div>
    <div class="modal-body">
      <p class="import-tip" id="importTip"></p>
      <div class="export-actions">
        <button class="btn ghost" id="importTemplateBtn">⬇ 下载模板 CSV</button>
      </div>
      <div class="field">
        <label>选择填写好的 CSV 文件</label>
        <input id="importFile" type="file" accept=".csv,text/csv">
      </div>
      <div class="export-actions">
        <button class="btn primary" id="importRun">导入</button>
      </div>
      <div class="export-result">
        <div class="export-info" id="importInfo"></div>
        <div class="table-wrap export-table" id="importTableWrap" hidden>
          <table>
            <thead>
              <tr><th>行号</th><th>失败原因</th></tr>
            </thead>
            <tbody id="importBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="confirmModal" hidden>
  <div class="modal confirm">
    <div class="modal-head">
      <h2>确认删除</h2>
    </div>
    <div class="modal-body">
      <p class="confirm-text" id="confirmText"></p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="confirmCancel">取消</button>
      <button class="btn danger" id="confirmOk">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/api/plugin/page/bridge-sdk.js"></script>
<script src="./app.js"></script>
